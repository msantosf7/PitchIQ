name: Atualização Diária do Robô

on:
  schedule:
    - cron: '0 7 * * *' # Roda às 04:00 da manhã (Horário de Brasília)
  workflow_dispatch: # Permite rodar manualmente pelo botão

jobs:
  rodar-ia:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # Atualizado para o Node 24 estável

      - name: Instalar dependências
        run: npm install

      - name: Executar o Motor de Poisson
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node index.js